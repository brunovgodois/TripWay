<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay - Contato</title>
</head>

<body>
    <header>
        <h1>Contato / Reserva</h1>

        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="destinos.html">Destinos</a></li>
                <li><a href="pacotes.html">Pacotes</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="secao-contato">
            <h2>Faça sua reserva</h2>
            <p>Preencha o formulário e entraremos em contato.</p>

            <img class="banner-contato" src="../images/banner.jpeg" alt="Banner do TripWay">

            <form class="form-contato" action="#" method="post">

                <div class="grupo-dados">
                    <h3>Seus dados</h3>

                    <div class="campo">
                        <label for="nome">Nome:</label>
                        <input class="campo-input" type="text" id="nome" name="nome"
                            placeholder="Digite seu nome completo" minlength="3" maxlength="80" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input class="campo-input" type="email" id="email" name="email"
                            placeholder="seuemail@exemplo.com" maxlength="100" required>
                    </div>
                </div>

                <div class="grupo-viagem">
                    <h3>Dados da viagem</h3>

                    <div class="campo">
                        <label for="destino">Destino de interesse:</label>
                        <select class="campo-input" id="destino" name="destino" required>
                            <option value="">Selecione...</option>
                            <option value="rio-de-janeiro">Rio de Janeiro</option>
                            <option value="lencois-maranhenses">Lençóis Maranhenses</option>
                            <option value="fernando-de-noronha">Fernando de Noronha</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="data">Data da viagem:</label>
                        <input class="campo-input" type="date" id="data" name="data" required>
                    </div>

                    <div class="campo">
                        <label for="pessoas">Quantidade de pessoas:</label>
                        <input class="campo-input" type="number" id="pessoas" name="pessoas"
                            placeholder="Ex.: 2" min="1" max="20" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea class="campo-input" id="mensagem" name="mensagem" rows="5" maxlength="500"
                        placeholder="Conte um pouco sobre o que você procura (opcional)"></textarea>
                </div>

                <button class="btn-enviar" type="submit">Enviar</button>

            </form>
        </section>
    </main>

    <footer>&copy; 2026 TripWay</footer>
</body>

</html>
